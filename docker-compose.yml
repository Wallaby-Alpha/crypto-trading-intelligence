services:
  # Autonomous Trading Bot Service
  weex-bot:
    build: .
    container_name: weex_crypto_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python run_live_bot.py --live
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Optional Live Streamlit Visual Dashboard
  dashboard:
    build: .
    container_name: weex_crypto_dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

